<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatDump — Export Any AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222222;
    --accent: #c8f135;
    --accent-dim: #8aab1f;
    --text: #e8e8e8;
    --text-muted: #666;
    --error: #ff4d4d;
    --radius: 4px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 60px;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,241,53,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,241,53,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow blob */
  body::after {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(200,241,53,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 72px 0 48px;
  }

  .logo-mark {
    display: inline-block;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 10px;
    margin-bottom: 24px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 6vw, 4.5rem);
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 13px;
    letter-spacing: 0.05em;
    max-width: 380px;
    margin: 0 auto;
    line-height: 1.7;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 36px;
    margin-bottom: 16px;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }

  label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
    min-width: 0;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  input[type="text"]::placeholder {
    color: var(--text-muted);
  }

  .format-row {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
  }

  .fmt-btn {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 10px 0;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .fmt-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .fmt-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 700;
  }

  .export-btn {
    width: 100%;
    background: var(--accent);
    border: none;
    color: #000;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .export-btn:hover {
    background: #d9ff40;
    transform: translateY(-1px);
  }

  .export-btn:active {
    transform: translateY(0);
  }

  .export-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .export-btn .btn-text { display: block; }

  /* Status */
  .status {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    font-size: 12px;
    min-height: 24px;
    text-align: center;
    color: var(--text-muted);
    padding: 0 8px;
    transition: all 0.3s;
  }

  .status.error { color: var(--error); }
  .status.success { color: var(--accent); }

  /* Loading animation */
  .loading-dots::after {
    content: '';
    animation: dots 1.2s steps(4, end) infinite;
  }

  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
  }

  /* Supported platforms */
  .platforms {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    margin-top: 32px;
  }

  .platforms-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
    text-align: center;
  }

  .platform-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .tag {
    font-size: 10px;
    letter-spacing: 0.1em;
    padding: 5px 12px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* Progress bar */
  .progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
    z-index: 100;
  }

  /* Success animation */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .success-msg {
    animation: fadeInUp 0.3s ease;
  }

  footer {
    position: relative;
    z-index: 1;
    margin-top: 60px;
    color: var(--text-muted);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-align: center;
  }
</style>
</head>
<body>

<div class="progress-bar" id="progressBar"></div>

<header>
  <div class="logo-mark">ChatDump v1.0</div>
  <h1>Export Any<br><span>AI Chat</span></h1>
  <p class="subtitle">Paste a share link. Get a clean file. Share with any LLM — no browser required.</p>
</header>

<div class="card">

  <label for="urlInput">Share Link</label>
  <div class="input-row">
    <input
      type="text"
      id="urlInput"
      placeholder="https://claude.ai/share/... or any AI chat link"
      autocomplete="off"
      spellcheck="false"
    >
  </div>

  <label>Output Format</label>
  <div class="format-row">
    <button class="fmt-btn active" data-fmt="txt" onclick="setFormat(this)">.TXT</button>
    <button class="fmt-btn" data-fmt="md" onclick="setFormat(this)">.MD</button>
    <button class="fmt-btn" data-fmt="json" onclick="setFormat(this)">.JSON</button>
  </div>

  <button class="export-btn" id="exportBtn" onclick="doExport()">
    <span class="btn-text" id="btnText">↓ Export Chat</span>
  </button>

</div>

<div class="status" id="status"></div>

<div class="platforms">
  <div class="platforms-label">Supported Platforms</div>
  <div class="platform-tags">
    <span class="tag">Claude.ai</span>
    <span class="tag">ChatGPT</span>
    <span class="tag">Gemini</span>
    <span class="tag">Perplexity</span>
    <span class="tag">Mistral</span>
    <span class="tag">More...</span>
  </div>
</div>

<footer>
  Opens link in a real browser headlessly · No data stored · Open source
</footer>

<script>
  let selectedFormat = 'txt';

  function setFormat(btn) {
    document.querySelectorAll('.fmt-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedFormat = btn.dataset.fmt;
  }

  function setStatus(msg, type = '') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + type;
  }

  function setProgress(pct) {
    document.getElementById('progressBar').style.width = pct + '%';
  }

  async function doExport() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) {
      setStatus('⚠ Paste a share link first.', 'error');
      return;
    }
    if (!url.startsWith('http')) {
      setStatus('⚠ URL must start with https://', 'error');
      return;
    }

    const btn = document.getElementById('exportBtn');
    const btnText = document.getElementById('btnText');

    btn.disabled = true;
    btnText.textContent = 'Fetching';
    btnText.classList.add('loading-dots');
    setStatus('Opening link in headless browser…', '');
    setProgress(20);

    try {
      const resp = await fetch('/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, format: selectedFormat })
      });

      setProgress(80);

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({ detail: 'Unknown error' }));
        throw new Error(err.detail || `HTTP ${resp.status}`);
      }

      // Download the file
      const blob = await resp.blob();
      const ext = selectedFormat;
      const filename = `chat_export.${ext}`;

      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();

      setProgress(100);
      setStatus('✓ Downloaded: ' + filename, 'success');
      setTimeout(() => setProgress(0), 1000);

    } catch (err) {
      setProgress(0);
      setStatus('✗ ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btnText.textContent = '↓ Export Chat';
      btnText.classList.remove('loading-dots');
    }
  }

  // Allow pressing Enter in URL input
  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doExport();
  });
</script>

</body>
</html>
